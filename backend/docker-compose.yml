services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: geofencing
      MYSQL_USER: geofence
      MYSQL_PASSWORD: geofence
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    environment:
      DATABASE_URL: mysql+aiomysql://geofence:geofence@mysql:3306/geofencing
      JWT_SECRET_KEY: change-this-to-a-long-secret
      BOOTSTRAP_ADMIN_PASSWORD: Admin@12345
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: